[project]
name = "geotiff-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crick>=0.0.8",
    "cython>=3.3.1",
    "gunicorn>=27.0.1",
    "ipython>=9.19.1",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "rasterio>=1.5.2",
    "rich>=15.0.0",
    "terracotta[recommended]>=0.10.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
]

[tool.uv]
# Security floors for transitive dependencies. These do not add packages to the
# project, but prevent resolution from selecting versions with known CVEs.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "flask>=3.1.3",
    "pillow>=13.0.0",
    "pygments>=2.20.0",
    "werkzeug>=3.1.9",
]
